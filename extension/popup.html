<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Translate AI</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <div class="brand"><span class="mark" aria-hidden="true">A가</span><span>Translate AI</span></div>
  <p class="eyebrow">READ IN TWO LANGUAGES</p>
  <h1>원문과 함께,<br>더 편하게 읽기.</h1>
  <p class="small">문단 아래에 번역을 더합니다.<br>원문과 링크는 그대로 유지됩니다.</p>
  <button id="toggle" class="primary">이 페이지 번역하기</button>
  <div class="row small"><span id="language">한국어로 읽기</span><kbd>Alt + A</kbd></div>
  <div class="hint"><strong>쓰는 순간에도 번역</strong><p class="small">입력창에서 <kbd>Space × 3</kbd><br><span id="input-language">영어로</span> 바꿉니다. <kbd>Alt + I</kbd>도 가능해요.</p></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <label id="model-field" hidden>ChatGPT 번역 모델<select id="codexModel" disabled></select><span class="help">선택하면 저장됩니다. 번역한 페이지는 껐다 켜세요.</span></label>
  <footer class="row"><button id="options" class="quiet">언어 · 번역 서비스 설정</button><span id="version" class="small muted"></span></footer>
  <script src="popup.js" type="module"></script>
</body></html>
